<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Dark Mode Toggle -->
  <button id="darkToggle" aria-label="Toggle dark mode">
    🌙
  </button>

  <div class="container">

    <header class="card">
      <p class="mood">✨ Grateful</p>
      <h1>Hi love</h1>
      <p class="subtitle">
        I made this so you’d always have a place to come back to us.
      </p>
    </header>

    <section class="card">
      <h2>⏳ Our Time</h2>
      <p id="togetherTime"></p>
      <p id="anniversaryCountdown"></p>
    </section>

    <section class="card memory-section">
      <h2>Memories</h2>

      <button id="randomMemoryBtn">Random Memory 💙</button>

      <div id="memoryDisplay" class="memory-card hidden">
        <img id="memoryImage" src="" alt="Memory" />
        <p class="memory-date" id="memoryDate"></p>
        <p class="memory-note" id="memoryNote"></p>
      </div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="memories.js"></script>
  <script src="script.js"></script>
</body>
</html>
