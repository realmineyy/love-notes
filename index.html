<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="darkToggle">🌙</button>

<div class="container">

  <header class="card">
    <p class="mood">✨ Grateful</p>
    <h1>Hi love</h1>
    <p class="subtitle">
      This is a place you can come back to whenever you need us.
    </p>
  </header>

  <section class="card">
    <h2>⏳ Our Time</h2>
    <p id="togetherTime"></p>
    <p id="anniversaryCountdown"></p>
  </section>

  <!-- Today's Message -->
  <section class="card">
    <h2>Today’s Note</h2>
    <p id="todayDate"></p>
    <p id="todayMessage"></p>

    <a href="archive.html" class="archive-link">
      View Message Archive →
    </a>
  </section>

  <!-- Memories -->
  <section class="card memory-section">
    <h2>Memories</h2>
    <button id="randomMemoryBtn">Random Memory 💙</button>

    <div id="memoryDisplay" class="memory-card hidden">
      <img id="memoryImage" />
      <p id="memoryDate"></p>
      <p id="memoryNote"></p>
    </div>
  </section>

</div>

<script src="data.js"></script>
<script src="memories.js"></script>
<script src="script.js"></script>
</body>
</html>
