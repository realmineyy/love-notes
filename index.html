<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <h1>For You ❤️</h1>

  <p id="countdown"></p>
  <p id="togetherTime"></p>

  <section id="entry">
    <img id="entryImage" alt="">
    <p id="entryMood"></p>
    <p id="entryMessage"></p>
    <span id="entryDate"></span>
  </section>

  <a href="archive.html">View past days →</a>
</main>

<script src="data.js"></script>
<script>
  const latest = entries[entries.length - 1];

  document.getElementById("entryImage").src = latest.image;
  document.getElementById("entryMood").textContent = latest.mood;
  document.getElementById("entryMessage").textContent = latest.message;
  document.getElementById("entryDate").textContent = latest.date;

  function updateCountdown() {
    const now = new Date();
    let anniversary = new Date(ANNIVERSARY_DATE);
    anniversary.setFullYear(now.getFullYear());

    if (anniversary < now) {
      anniversary.setFullYear(now.getFullYear() + 1);
    }

    const daysLeft = Math.ceil(
      (anniversary - now) / (1000 * 60 * 60 * 24)
    );

    document.getElementById("countdown").textContent =
      `💖 ${daysLeft} days until our anniversary`;
  }

  function updateTogetherTime() {
    const start = new Date(TOGETHER_SINCE);
    const now = new Date();

    let years = now.getFullYear() - start.getFullYear();
    let months = now.getMonth() - start.getMonth();
    let days = now.getDate() - start.getDate();

    if (days < 0) {
      months--;
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    const diffMs = now - start;
    const hours = Math.floor(diffMs / (1000 * 60 * 60)) % 24;
    const minutes = Math.floor(diffMs / (1000 * 60)) % 60;

    document.getElementById("togetherTime").textContent =
      `⏳ We’ve been together for ${years} years, ${months} months, ${days} days, ${hours} hours, and ${minutes} minutes`;
  }

  updateCountdown();
  updateTogetherTime();

  // Optional: update time every minute
  setInterval(updateTogetherTime, 60000);
</script>

</body>
</html>
